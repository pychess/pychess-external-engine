name: Python checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.7"
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - name: Check formatting, lint and types
        run: |
          uv run --frozen ruff format --check --target-version py313 .
          uv run --frozen ruff check .
          uv run --frozen pyrefly check --min-severity warn

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.7"
          python-version: "3.13"
      - name: Check versions and release tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          uv run --frozen python -m tools.release_check --tag "$RELEASE_TAG"
          if [[ -n "$RELEASE_TAG" ]]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
      - name: Build and validate distributions
        run: |
          uv build --no-sources
          uv run --frozen python -m tools.release_check --dist dist
          uvx twine check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  test:
    name: Install ${{ matrix.distribution }} / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        distribution: [wheel, source]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Verify distribution hashes
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Test installed distribution
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          if [[ "$DISTRIBUTION" == wheel ]]; then
            artifact=(dist/*.whl)
          else
            artifact=(dist/*.tar.gz)
          fi
          uv run --frozen python -m tools.install_probe \
            --artifact "${artifact[0]}" --python "$PYTHON_VERSION" \
            --output install-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.python-version }}-${{ matrix.distribution }}
          path: install-receipt.json
          if-no-files-found: error
