name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and checks
        run: python -m pip install '.[dev,alice]'
      - name: Check formatting and lint
        run: |
          ruff format --check --target-version py313 .
          ruff check .
      - name: Type check
        run: pyrefly check --min-severity warn
      - name: Rules and lifecycle tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source archive
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install build
          python -m build
