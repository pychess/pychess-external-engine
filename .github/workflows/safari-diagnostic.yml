name: Real Safari diagnostic

on:
  workflow_dispatch:
    inputs:
      fixture_url:
        description: "Non-production HTTPS fixture URL with COOP/COEP headers"
        required: true
        type: string

permissions:
  contents: read

jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Enable Safari automation
        run: |
          defaults write com.apple.Safari AllowRemoteAutomation -bool true
          sudo -n safaridriver --enable
      - name: Run real Safari loopback diagnostic
        env:
          SAFARI_FIXTURE_URL: ${{ inputs.fixture_url }}
        run: |
          uv run --with selenium python -m tools.safari_probe \
            --site "$SAFARI_FIXTURE_URL" > safari-diagnostic.json
          cat safari-diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-diagnostic
          path: safari-diagnostic.json
          if-no-files-found: warn
