[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pychess-external-engine"
version = "0.1.0a1"
description = "Local native UCI engine analysis for Pychess"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["aiohttp>=3.12,<4", "pyffish==0.0.90"]

[project.optional-dependencies]
dev = ["playwright>=1.50", "pyrefly>=1.3", "ruff>=0.16"]

[project.scripts]
pychess-external-engine = "pychess_external_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
project-includes = ["src", "tools", "tests"]
search-path = ["src", ".", "tests"]
